<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=backspace" />
    <link rel="stylesheet" href="src/styles.css">
    <title>Calculator App</title>
</head>
<body>
    
    <div class="container">
        <div class="container-fluid">
            <div class="dashboard">
                <div class="display"></div>
            <div class="result"></div>
        </div>
            <div class="numbers">
                <button class="color"><span class="material-symbols-outlined ">
                    backspace
                </span></button>
                <button class="color">AC</button>
                <button class="color">%</button>
                <button class="operation">÷</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operation">×</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operation">-</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operation">+</button>
                <button>+/-</button>
                <button>0</button>
                <button>.</button>
                <button class="operation">=</button>
            </div>
        </div>

    </div>
    <script src="src/script.js"></script>
</body>
</html>
